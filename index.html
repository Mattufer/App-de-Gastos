<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mis Finanzas Gs.</title>

  <!-- Configuración para que funcione como App nativa en pantalla completa en iPhone (iOS PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gastos Gs." />
  <meta name="theme-color" content="#0f172a" />

  <!-- Ícono integrado SVG para la pantalla de inicio de iPhone -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f172a'/%3E%3Ctext x='90' y='112' font-family='-apple-system, sans-serif' font-size='76' font-weight='800' fill='%2310b981' text-anchor='middle'%3EGs%3C/text%3E%3C/svg%3E" />

  <!-- Manifiesto PWA embebido -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Mis%20Finanzas%20Gs.%22%2C%22short_name%22%3A%22Gastos%20Gs.%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%7D" />

  <style>
    /* Variables de diseño minimalista oscuro (alto contraste y cero distracciones) */
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.16);
      --red: #f43f5e;
      --red-bg: rgba(244, 63, 94, 0.16);
      --amber: #f59e0b;
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 16px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: calc(var(--safe-top) + 12px);
      padding-bottom: calc(var(--safe-bottom) + 78px);
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 18px;
      flex: 1;
    }

    /* Encabezado compacto */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .balance-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .balance-pill span {
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }

    .balance-pill.negative span {
      color: var(--red);
    }

    /* Vistas */
    .view {
      display: none;
      animation: fadeIn 0.18s ease-out;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mini Tab Superior (Categorías / Fuentes) */
    .category-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .tabs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .tabs-grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .cat-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      padding: 12px 10px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-btn:active {
      transform: scale(0.97);
    }

    .cat-btn.selected-expense {
      background: var(--red-bg);
      border-color: var(--red);
      color: #fff;
    }

    .cat-btn.selected-income {
      background: var(--green-bg);
      border-color: var(--green);
      color: #fff;
    }

    /* Fila principal: Botones + / - a la izquierda + Input de Guaraníes */
    .amount-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
      margin-bottom: 10px;
    }

    .sign-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 58px;
      flex-shrink: 0;
    }

    .sign-btn {
      flex: 1;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--surface);
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .sign-btn:active {
      transform: scale(0.94);
    }

    .sign-btn.plus {
      color: var(--green);
    }

    .sign-btn.plus.active {
      background: var(--green);
      border-color: var(--green);
      color: #062e22;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .sign-btn.minus {
      color: var(--red);
    }

    .sign-btn.minus.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.35);
    }

    .input-box-wrapper {
      flex: 1;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: border-color 0.15s ease;
    }

    .input-box-wrapper.mode-expense:focus-within {
      border-color: var(--red);
    }

    .input-box-wrapper.mode-income:focus-within {
      border-color: var(--green);
    }

    .input-hint-top {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .amount-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 2.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .amount-input::placeholder {
      color: #475569;
    }

    /* Vista previa exacta en Guaraníes */
    .preview-bar {
      background: rgba(30, 41, 59, 0.65);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.92rem;
    }

    .preview-bar .label {
      color: var(--text-muted);
    }

    .preview-bar .value {
      font-weight: 700;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
    }

    .preview-bar.expense .value {
      color: var(--red);
    }

    .preview-bar.income .value {
      color: var(--green);
    }

    /* Nota opcional minimalista */
    .note-input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
    }

    .note-input:focus {
      border-color: #64748b;
    }

    /* Botón Confirmar */
    .confirm-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: var(--radius);
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
      margin-bottom: 26px;
    }

    .confirm-btn:active {
      transform: scale(0.98);
    }

    .confirm-btn.expense {
      background: var(--red);
      color: #fff;
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.25);
    }

    .confirm-btn.income {
      background: var(--green);
      color: #052e16;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.25);
    }

    /* Lista de últimos movimientos */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tx-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tx-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .tx-cat {
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tx-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tx-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .tx-amount {
      font-weight: 700;
      font-size: 0.96rem;
      font-variant-numeric: tabular-nums;
    }

    .tx-amount.expense {
      color: var(--red);
    }

    .tx-amount.income {
      color: var(--green);
    }

    .del-btn {
      background: rgba(148, 163, 184, 0.12);
      border: none;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .del-btn:active {
      background: var(--red-bg);
      color: var(--red);
    }

    /* PÁGINA 2: RESUMEN MENSUAL */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 12px;
      margin-bottom: 16px;
    }

    .month-btn {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 8px;
    }

    .month-btn:active {
      background: var(--surface-hover);
    }

    .month-current {
      font-weight: 700;
      font-size: 1rem;
      text-transform: capitalize;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .stat-val {
      font-size: 0.92rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* Tarjetas de presupuesto por categoría */
    .budget-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .budget-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .budget-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .budget-name {
      font-weight: 700;
      font-size: 1rem;
    }

    .edit-limit-btn {
      background: rgba(148, 163, 184, 0.14);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .edit-limit-btn:active {
      background: var(--surface-hover);
    }

    .budget-numbers {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }

    .budget-spent {
      font-weight: 700;
      color: var(--text);
    }

    .budget-limit-text {
      color: var(--text-muted);
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .budget-footer {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Edición inline de límite */
    .inline-edit-box {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .inline-edit-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      outline: none;
    }

    .inline-save-btn {
      background: var(--green);
      color: #052e16;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Desglose de Ingresos */
    .income-sources {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .source-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.92rem;
    }

    .source-row span:first-child {
      color: var(--text-muted);
      font-weight: 600;
    }

    .source-row span:last-child {
      color: var(--green);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Botones de Respaldo JSON */
    .backup-bar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .backup-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 11px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .backup-btn:active {
      background: var(--surface-hover);
      color: var(--text);
    }

    /* Barra de navegación inferior fija (estilo app nativa iOS) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 18px calc(var(--safe-bottom) + 8px);
      display: flex;
      justify-content: center;
      z-index: 50;
    }

    .nav-inner {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .nav-btn.active {
      background: var(--surface);
      color: var(--text);
    }

    /* Notificación Toast flotante */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: #f8fafc;
      color: #0f172a;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      z-index: 100;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 20px;
      background: rgba(30, 41, 59, 0.4);
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <!-- Notificación rápida -->
  <div id="toast" class="toast">Guardado</div>

  <div class="container">
    <!-- Encabezado con saldo del mes -->
    <header>
      <div class="app-title">Mis Finanzas</div>
      <div id="headerBalancePill" class="balance-pill">
        Saldo: <span id="headerBalanceVal">0 Gs.</span>
      </div>
    </header>

    <!-- ========================================== -->
    <!-- PÁGINA 1: REGISTRO RÁPIDO                  -->
    <!-- ========================================== -->
    <section id="view-register" class="view active">

      <!-- Mini Tab Superior: Categorías de Gasto o Fuentes de Ingreso -->
      <div id="tabSectionTitle" class="category-label">¿En qué gastaste?</div>
      <div id="categoryTabs" class="tabs-grid">
        <!-- Se llena dinámicamente según + o - -->
      </div>

      <!-- Fila de ingreso: Botones + / - a la izquierda + Input numérico -->
      <div class="amount-row">
        <div class="sign-controls">
          <button type="button" id="btnPlus" class="sign-btn plus" aria-label="Añadir dinero">+</button>
          <button type="button" id="btnMinus" class="sign-btn minus active" aria-label="Registrar gasto">−</button>
        </div>

        <div id="inputWrapper" class="input-box-wrapper mode-expense">
          <div class="input-hint-top">
            <span>Monto en miles</span>
            <span>Ej: 140.5 = 140.500</span>
          </div>
          <input
            type="text"
            id="amountInput"
            class="amount-input"
            inputmode="decimal"
            placeholder="0"
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Confirmación visual en tiempo real del valor real en Guaraníes -->
      <div id="previewBar" class="preview-bar expense">
        <span class="label" id="previewLabel">Gasto en Comida:</span>
        <span class="value" id="previewValue">0 Gs.</span>
      </div>

      <!-- Nota opcional de 1 línea -->
      <input
        type="text"
        id="noteInput"
        class="note-input"
        placeholder="Nota opcional (ej: lomito, carga rápida...)"
        maxlength="60"
      />

      <!-- Botón Confirmar -->
      <button type="button" id="confirmBtn" class="confirm-btn expense">
        Confirmar Gasto
      </button>

      <!-- Últimos 5 movimientos para tranquilidad inmediata -->
      <div class="section-header">
        <span class="section-title">Últimos registros</span>
      </div>
      <div id="recentList" class="tx-list"></div>
    </section>

    <!-- ========================================== -->
    <!-- PÁGINA 2: RESUMEN MENSUAL Y PRESUPUESTOS   -->
    <!-- ========================================== -->
    <section id="view-summary" class="view">

      <!-- Selector de mes -->
      <div class="month-nav">
        <button type="button" id="prevMonthBtn" class="month-btn" aria-label="Mes anterior">‹</button>
        <div id="currentMonthLabel" class="month-current">Noviembre 2026</div>
        <button type="button" id="nextMonthBtn" class="month-btn" aria-label="Mes siguiente">›</button>
      </div>

      <!-- Tarjetas resumen del mes -->
      <div class="summary-cards">
        <div class="stat-card">
          <div class="stat-label">Ingresos</div>
          <div id="sumIncome" class="stat-val" style="color: var(--green);">0 Gs.</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Gastado</div>
          <div id="sumExpense" class="stat-val" style="color: var(--red);">0 Gs.</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Disponible</div>
          <div id="sumBalance" class="stat-val">0 Gs.</div>
        </div>
      </div>

      <!-- Gastos por categoría con topes editables -->
      <div class="section-header">
        <span class="section-title">Gastos vs. Límite Mensual</span>
      </div>
      <div id="budgetList" class="budget-list"></div>

      <!-- Desglose de ingresos por fuente -->
      <div class="section-header">
        <span class="section-title">Ingresos del mes por fuente</span>
      </div>
      <div id="incomeSourcesList" class="income-sources"></div>

      <!-- Respaldo manual JSON -->
      <div class="section-header">
        <span class="section-title">Copia de seguridad</span>
      </div>
      <div class="backup-bar">
        <button type="button" id="exportBtn" class="backup-btn">Exportar respaldo</button>
        <button type="button" id="importBtn" class="backup-btn">Importar respaldo</button>
        <input type="file" id="importFileInput" accept=".json,application/json" style="display: none;" />
      </div>
    </section>
  </div>

  <!-- Navegación inferior fija -->
  <nav class="bottom-nav">
    <div class="nav-inner">
      <button type="button" id="navRegister" class="nav-btn active">
        <span>+ / −</span> Registrar
      </button>
      <button type="button" id="navSummary" class="nav-btn">
        <span>📊</span> Resumen Mes
      </button>
    </div>
  </nav>

  <script>
    /**
     * CONFIGURACIÓN INICIAL Y ESTADO DE LA APLICACIÓN
     */
    const STORAGE_KEY = 'finanzas_gs_v1';

    const EXPENSE_CATEGORIES = ['Comida', 'Ocio', 'Electricidad Auto', 'Estupideces'];
    const INCOME_SOURCES = ['Bolt', 'Impresiones 3D', 'Trabajo'];

    // Topes mensuales por defecto en Guaraníes (editables desde la página 2)
    const DEFAULT_BUDGETS = {
      'Comida': 1500000,
      'Ocio': 600000,
      'Electricidad Auto': 400000,
      'Estupideces': 300000
    };

    // Estado en memoria
    let state = {
      transactions: [], // { id, type: 'expense'|'income', category, amount, note, dateISO }
      budgets: { ...DEFAULT_BUDGETS }
    };

    let currentMode = 'expense'; // 'expense' (-) o 'income' (+)
    let selectedCategory = EXPENSE_CATEGORIES[0];
    let editingBudgetCat = null;

    // Mes seleccionado en la página 2 (YYYY-MM)
    let viewDate = new Date();

    /**
     * PERSISTENCIA EN LOCALSTORAGE
     */
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.transactions)) {
            state.transactions = parsed.transactions;
          }
          if (parsed.budgets && typeof parsed.budgets === 'object') {
            state.budgets = { ...DEFAULT_BUDGETS, ...parsed.budgets };
          }
        }
      } catch (e) {
        console.error('Error cargando datos:', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        showToast('Error al guardar en memoria');
      }
    }

    /**
     * UTILIDADES DE FORMATO Y PARSEO DE GUARANÍES
     */
    // Convierte "140" -> 140000, "140.5" o "140,5" -> 140500
    function parseGuaraniesInput(rawStr) {
      if (!rawStr) return 0;
      // Limpiar espacios y reemplazar coma por punto decimal
      let cleaned = rawStr.trim().replace(/\s+/g, '').replace(',', '.');
      // Dejar solo dígitos y el primer punto decimal
      cleaned = cleaned.replace(/[^0-9.]/g, '');
      const parts = cleaned.split('.');
      if (parts.length > 2) {
        cleaned = parts[0] + '.' + parts.slice(1).join('');
      }

      const num = parseFloat(cleaned);
      if (isNaN(num) || num <= 0) return 0;

      // Multiplicar por 1.000 (ej: 140 -> 140.000; 140.5 -> 140.500)
      return Math.round(num * 1000);
    }

    function formatGs(amount) {
      const sign = amount < 0 ? '-' : '';
      const absVal = Math.abs(Math.round(amount));
      return sign + absVal.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' Gs.';
    }

    function getMonthKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      return `${y}-${m}`;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    /**
     * RENDERIZADO DE PÁGINA 1 (REGISTRO)
     */
    function renderTabs() {
      const container = document.getElementById('categoryTabs');
      const title = document.getElementById('tabSectionTitle');
      const items = currentMode === 'expense' ? EXPENSE_CATEGORIES : INCOME_SOURCES;

      title.textContent = currentMode === 'expense'
        ? '¿En qué gastaste?'
        : '¿De dónde entró el dinero?';

      container.className = currentMode === 'expense' ? 'tabs-grid' : 'tabs-grid cols-3';
      container.innerHTML = '';

      items.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = item;
        btn.className = 'cat-btn';

        if (item === selectedCategory) {
          btn.classList.add(currentMode === 'expense' ? 'selected-expense' : 'selected-income');
        }

        btn.addEventListener('click', () => {
          selectedCategory = item;
          renderTabs();
          updatePreview();
        });

        container.appendChild(btn);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      const btnPlus = document.getElementById('btnPlus');
      const btnMinus = document.getElementById('btnMinus');
      const wrapper = document.getElementById('inputWrapper');
      const previewBar = document.getElementById('previewBar');
      const confirmBtn = document.getElementById('confirmBtn');

      if (mode === 'income') {
        btnPlus.classList.add('active');
        btnMinus.classList.remove('active');
        wrapper.className = 'input-box-wrapper mode-income';
        previewBar.className = 'preview-bar income';
        confirmBtn.className = 'confirm-btn income';
        confirmBtn.textContent = 'Confirmar Ingreso';
        if (!INCOME_SOURCES.includes(selectedCategory)) {
          selectedCategory = INCOME_SOURCES[0];
        }
      } else {
        btnMinus.classList.add('active');
        btnPlus.classList.remove('active');
        wrapper.className = 'input-box-wrapper mode-expense';
        previewBar.className = 'preview-bar expense';
        confirmBtn.className = 'confirm-btn expense';
        confirmBtn.textContent = 'Confirmar Gasto';
        if (!EXPENSE_CATEGORIES.includes(selectedCategory)) {
          selectedCategory = EXPENSE_CATEGORIES[0];
        }
      }

      renderTabs();
      updatePreview();
    }

    function updatePreview() {
      const raw = document.getElementById('amountInput').value;
      const gs = parseGuaraniesInput(raw);
      const label = document.getElementById('previewLabel');
      const val = document.getElementById('previewValue');

      label.textContent = currentMode === 'expense'
        ? `Gasto en ${selectedCategory}:`
        : `Ingreso por ${selectedCategory}:`;

      val.textContent = formatGs(gs);
    }

    function handleConfirm() {
      const input = document.getElementById('amountInput');
      const noteEl = document.getElementById('noteInput');
      const gs = parseGuaraniesInput(input.value);

      if (gs <= 0) {
        showToast('Ingresá un monto válido');
        input.focus();
        return;
      }

      const tx = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        type: currentMode,
        category: selectedCategory,
        amount: gs,
        note: noteEl.value.trim(),
        dateISO: new Date().toISOString()
      };

      state.transactions.unshift(tx);
      saveState();

      // Limpiar campos y dar feedback
      input.value = '';
      noteEl.value = '';
      updatePreview();
      renderRecentList();
      updateHeaderBalance();

      const prefix = currentMode === 'expense' ? '−' : '+';
      showToast(`${prefix} ${formatGs(gs)} (${selectedCategory})`);
    }

    function deleteTransaction(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      saveState();
      renderRecentList();
      updateHeaderBalance();
      if (document.getElementById('view-summary').classList.contains('active')) {
        renderSummary();
      }
      showToast('Registro eliminado');
    }

    function renderRecentList() {
      const container = document.getElementById('recentList');
      const recent = state.transactions.slice(0, 5);

      if (recent.length === 0) {
        container.innerHTML = '<div class="empty-state">Todavía no registraste movimientos.</div>';
        return;
      }

      container.innerHTML = '';
      recent.forEach(tx => {
        const date = new Date(tx.dateISO);
        const dayStr = date.toLocaleDateString('es-PY', { day: '2-digit', month: 'short' });
        const timeStr = date.toLocaleTimeString('es-PY', { hour: '2-digit', minute: '2-digit' });
        const meta = tx.note ? `${dayStr} ${timeStr} · ${tx.note}` : `${dayStr} ${timeStr}`;

        const row = document.createElement('div');
        row.className = 'tx-item';
        row.innerHTML = `
          <div class="tx-info">
            <div class="tx-cat">
              <span class="tx-dot" style="background: ${tx.type === 'expense' ? 'var(--red)' : 'var(--green)'}"></span>
              ${escapeHtml(tx.category)}
            </div>
            <div class="tx-meta">${escapeHtml(meta)}</div>
          </div>
          <div class="tx-right">
            <span class="tx-amount ${tx.type}">
              ${tx.type === 'expense' ? '−' : '+'}${formatGs(tx.amount)}
            </span>
            <button type="button" class="del-btn" aria-label="Borrar">×</button>
          </div>
        `;

        row.querySelector('.del-btn').addEventListener('click', () => deleteTransaction(tx.id));
        container.appendChild(row);
      });
    }

    function updateHeaderBalance() {
      const currentMonthKey = getMonthKey(new Date());
      let inc = 0;
      let exp = 0;

      state.transactions.forEach(tx => {
        if (tx.dateISO.startsWith(currentMonthKey)) {
          if (tx.type === 'income') inc += tx.amount;
          else exp += tx.amount;
        }
      });

      const bal = inc - exp;
      const pill = document.getElementById('headerBalancePill');
      const valEl = document.getElementById('headerBalanceVal');

      valEl.textContent = formatGs(bal);
      if (bal < 0) pill.classList.add('negative');
      else pill.classList.remove('negative');
    }

    /**
     * RENDERIZADO DE PÁGINA 2 (RESUMEN MENSUAL Y PRESUPUESTOS)
     */
    function renderSummary() {
      const monthKey = getMonthKey(viewDate);
      const monthName = viewDate.toLocaleDateString('es-PY', { month: 'long', year: 'numeric' });
      document.getElementById('currentMonthLabel').textContent = monthName;

      // Filtrar transacciones del mes seleccionado
      const monthTxs = state.transactions.filter(tx => tx.dateISO.startsWith(monthKey));

      let totalIncome = 0;
      let totalExpense = 0;
      const spentByCat = {};
      const incomeBySource = {};

      EXPENSE_CATEGORIES.forEach(c => spentByCat[c] = 0);
      INCOME_SOURCES.forEach(s => incomeBySource[s] = 0);

      monthTxs.forEach(tx => {
        if (tx.type === 'income') {
          totalIncome += tx.amount;
          incomeBySource[tx.category] = (incomeBySource[tx.category] || 0) + tx.amount;
        } else {
          totalExpense += tx.amount;
          spentByCat[tx.category] = (spentByCat[tx.category] || 0) + tx.amount;
        }
      });

      const balance = totalIncome - totalExpense;
      document.getElementById('sumIncome').textContent = formatGs(totalIncome);
      document.getElementById('sumExpense').textContent = formatGs(totalExpense);
      const balEl = document.getElementById('sumBalance');
      balEl.textContent = formatGs(balance);
      balEl.style.color = balance >= 0 ? 'var(--green)' : 'var(--red)';

      // Renderizar tarjetas de presupuesto por categoría
      const budgetList = document.getElementById('budgetList');
      budgetList.innerHTML = '';

      EXPENSE_CATEGORIES.forEach(cat => {
        const spent = spentByCat[cat] || 0;
        const limit = state.budgets[cat] || 0;
        const pct = limit > 0 ? Math.min(100, Math.round((spent / limit) * 100)) : (spent > 0 ? 100 : 0);
        const remaining = limit - spent;

        let barColor = 'var(--green)';
        if (limit > 0 && spent > limit) barColor = 'var(--red)';
        else if (limit > 0 && spent >= limit * 0.8) barColor = 'var(--amber)';

        const card = document.createElement('div');
        card.className = 'budget-card';

        const isEditing = editingBudgetCat === cat;

        card.innerHTML = `
          <div class="budget-top">
            <span class="budget-name">${escapeHtml(cat)}</span>
            <button type="button" class="edit-limit-btn" data-cat="${escapeHtml(cat)}">
              ✎ Editar tope
            </button>
          </div>
          <div class="budget-numbers">
            <span class="budget-spent">${formatGs(spent)}</span>
            <span class="budget-limit-text">de ${formatGs(limit)}</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width: ${pct}%; background: ${barColor};"></div>
          </div>
          <div class="budget-footer">
            <span>${pct}% usado</span>
            <span style="color: ${remaining < 0 ? 'var(--red)' : 'var(--text-muted)'}">
              ${remaining >= 0 ? 'Quedan ' + formatGs(remaining) : 'Excedido por ' + formatGs(Math.abs(remaining))}
            </span>
          </div>
          ${isEditing ? `
            <div class="inline-edit-box">
              <input
                type="text"
                inputmode="decimal"
                class="inline-edit-input"
                id="editInput_${cat}"
                placeholder="Ej: 500 = 500.000 Gs."
                value="${limit > 0 ? (limit / 1000) : ''}"
              />
              <button type="button" class="inline-save-btn" id="saveBtn_${cat}">Guardar</button>
            </div>
          ` : ''}
        `;

        card.querySelector('.edit-limit-btn').addEventListener('click', () => {
          editingBudgetCat = (editingBudgetCat === cat) ? null : cat;
          renderSummary();
          if (editingBudgetCat) {
            const inp = document.getElementById(`editInput_${cat}`);
            if (inp) inp.focus();
          }
        });

        if (isEditing) {
          const saveBtn = card.querySelector(`#saveBtn_${cat}`);
          const inp = card.querySelector(`#editInput_${cat}`);
          const commitBudget = () => {
            const newLimit = parseGuaraniesInput(inp.value);
            state.budgets[cat] = newLimit;
            editingBudgetCat = null;
            saveState();
            renderSummary();
            showToast(`Tope de ${cat}: ${formatGs(newLimit)}`);
          };
          saveBtn.addEventListener('click', commitBudget);
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') commitBudget();
          });
        }

        budgetList.appendChild(card);
      });

      // Renderizar desglose de ingresos por fuente
      const sourcesList = document.getElementById('incomeSourcesList');
      sourcesList.innerHTML = '';
      INCOME_SOURCES.forEach(src => {
        const val = incomeBySource[src] || 0;
        const row = document.createElement('div');
        row.className = 'source-row';
        row.innerHTML = `
          <span>${escapeHtml(src)}</span>
          <span>+${formatGs(val)}</span>
        `;
        sourcesList.appendChild(row);
      });
    }

    /**
     * EXPORTAR E IMPORTAR RESPALDO JSON
     */
    function exportJSON() {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const today = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `respaldo-gastos-${today}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Respaldo descargado');
    }

    function importJSON(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && Array.isArray(parsed.transactions)) {
            state.transactions = parsed.transactions;
            if (parsed.budgets) {
              state.budgets = { ...DEFAULT_BUDGETS, ...parsed.budgets };
            }
            saveState();
            renderRecentList();
            updateHeaderBalance();
            renderSummary();
            showToast('Datos restaurados con éxito');
          } else {
            showToast('Archivo inválido');
          }
        } catch (err) {
          showToast('No se pudo leer el archivo');
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /**
     * NAVEGACIÓN Y EVENTOS
     */
    function switchView(viewName) {
      const vReg = document.getElementById('view-register');
      const vSum = document.getElementById('view-summary');
      const nReg = document.getElementById('navRegister');
      const nSum = document.getElementById('navSummary');

      if (viewName === 'register') {
        vReg.classList.add('active');
        vSum.classList.remove('active');
        nReg.classList.add('active');
        nSum.classList.remove('active');
        renderRecentList();
      } else {
        vSum.classList.add('active');
        vReg.classList.remove('active');
        nSum.classList.add('active');
        nReg.classList.remove('active');
        editingBudgetCat = null;
        renderSummary();
      }
    }

    // Inicialización al cargar
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      setMode('expense');
      renderRecentList();
      updateHeaderBalance();

      document.getElementById('btnPlus').addEventListener('click', () => setMode('income'));
      document.getElementById('btnMinus').addEventListener('click', () => setMode('expense'));

      const amountInput = document.getElementById('amountInput');
      amountInput.addEventListener('input', updatePreview);
      amountInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleConfirm();
      });

      document.getElementById('confirmBtn').addEventListener('click', handleConfirm);

      document.getElementById('navRegister').addEventListener('click', () => switchView('register'));
      document.getElementById('navSummary').addEventListener('click', () => switchView('summary'));

      document.getElementById('prevMonthBtn').addEventListener('click', () => {
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
        editingBudgetCat = null;
        renderSummary();
      });

      document.getElementById('nextMonthBtn').addEventListener('click', () => {
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
        editingBudgetCat = null;
        renderSummary();
      });

      document.getElementById('exportBtn').addEventListener('click', exportJSON);
      document.getElementById('importBtn').addEventListener('click', () => {
        document.getElementById('importFileInput').click();
      });
      document.getElementById('importFileInput').addEventListener('change', (e) => {
        importJSON(e.target.files[0]);
        e.target.value = '';
      });
    });
  </script>
</body>
</html>
